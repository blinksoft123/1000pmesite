<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlinksoftTech - Digitalisez votre PME</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#07a5ed",
              "primary-hover": "#058dc9",
              "background-light": "#f5f7f8",
              "background-dark": "#0f1d23",
              "card-dark": "#182c35",
              "border-dark": "#2f576a",
              "text-muted": "#8eb9cc",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            boxShadow: {
              "glow-primary": "0 0 15px 5px rgba(7, 165, 237, 0.3)",
              "glow-primary-hover": "0 0 25px 8px rgba(7, 165, 237, 0.4)",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .material-symbols-outlined.filled {
        font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .neon-glow {
        box-shadow: 0 0 5px theme("colors.primary"),
          0 0 10px theme("colors.primary"), 0 0 15px theme("colors.primary"),
          0 0 20px theme("colors.primary / 0.5");
      }
    </style>

}
</script>
